name: Deploy

# Production deploys run only from main, by hand. The run log records which commit went live, and
# everything deployed is signed (build provenance) so the Verify live workflow can prove it later.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Firebase deploy targets (passed to --only)"
        default: "functions,firestore,storage,hosting"
        required: true
      dry_run:
        description: "Validate and show what would change without deploying"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Tests run without any cloud identity, so dependency code never sees a token.
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm test
      - name: Check deploy targets
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/live-state.mjs --check-targets "$ONLY"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      started: ${{ steps.start.outputs.time }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deploying an older commit would roll production back under a valid signature.
      - name: Check this is the head of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $head, but this run is for $GITHUB_SHA. Start a new run."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No install scripts: nothing from npm runs before the deploy itself.
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: functions
      # Keyless: GitHub's OIDC token is exchanged through Workload Identity Federation, which only
      # trusts this workflow file on main, started by hand. No credential is stored in GitHub.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # A minute of slack for clock skew between the runner and Google.
      - id: start
        run: echo "time=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Deploy ${{ inputs.only }} at ${{ github.sha }}${{ inputs.dry_run && ' (dry run)' || '' }}
        env:
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # No --force: a deploy that would delete a live function stops instead.
        run: npx --no-install firebase deploy --only "$ONLY" --project always-on-time-zombit-2026 --non-interactive $DRY_RUN

  # Signing runs separately, with no npm packages installed, so only first-party scripts and pinned
  # actions can produce or sign the attestation.
  sign:
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      # Functions are signed only if this deploy updated them; rules and hosting are always current.
      - name: Collect what this deploy made live
        id: live
        env:
          ONLY: ${{ inputs.only }}
          STARTED: ${{ needs.deploy.outputs.started }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          node scripts/live-state.mjs --targets "$ONLY" --updated-since "$STARTED" --out live
          echo "count=$(wc -l < live/checksums.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Sign the deployed artifacts
        if: steps.live.outputs.count != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: live/checksums.txt
