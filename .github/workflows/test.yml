name: Test

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            workers/ios-relay/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Unit tests
        run: npm test
        working-directory: functions
      - name: iOS relay Worker tests
        working-directory: workers/ios-relay
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Deploy and verification script tests
        run: node --test 'scripts/test/*.test.mjs'
      - name: Emulator placeholders
        # The emulator loads every function, so declared secrets and params need stand-in values.
        run: |
          printf 'APNS_AUTH_KEY_P8=emulator\nFEEDBACK_DISCORD_WEBHOOK_URL=http://127.0.0.1:9/unused\nTOMTOM_API_KEY=emulator\nTRAVEL_ROUTE_API_KEY=emulator\n' > functions/.secret.local
          grep -v '^ASSISTANT_DEMO_UID=' functions/.env.always-on-time-zombit-2026 > functions/.env.local
          echo 'ASSISTANT_DEMO_UID=e2e-review-account' >> functions/.env.local
      - name: Security rules and Firestore emulator tests
        run: npx firebase emulators:exec --only firestore,storage --project demo-account-sync 'node functions/testing/storage-rules.cjs && node functions/testing/account-sync-rules.cjs && node functions/testing/assistant-rules.cjs && npm --prefix functions test'
      - name: Account deletion and assistant connector end to end
        run: npx firebase emulators:exec --only auth,firestore,functions,hosting --project demo-account-sync 'node functions/testing/hosting-headers.cjs && node functions/testing/account-delete.cjs && node functions/testing/assistant-e2e.cjs'
